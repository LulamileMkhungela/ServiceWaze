<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>ServiceWaze — know it's coming, be ready, share what you have</title>
<meta name="description" content="South Africa's household resilience network: predict water, power and transport disruptions, prepare in time, share with neighbours and cut household costs.">
<meta name="theme-color" content="#080d17">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icons/icon-192.png">
<link rel="apple-touch-icon" href="/static/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/static/css/app.css?v=3.2.0">
</head>
<body>
<div class="splash" id="splash"><div class="l">🚰</div></div>

<div id="app">
  <header>
    <div class="hrow">
      <div class="brand">
        <span class="dot">🚰</span>
        <span>ServiceWaze<small>HOUSEHOLD RESILIENCE</small></span>
      </div>
      <span class="spacer"></span>
      <span class="pill live" id="livePill"><span class="dot pulse"></span><span>Live</span></span>
      <button class="iconbtn" id="langBtn" title="Language" aria-label="Language">🌐</button>
      <button class="iconbtn" id="themeBtnTop" title="Theme" aria-label="Theme">🌓</button>
      <button class="sosbtn" id="sosBtn" title="Emergency" aria-label="Emergency help">🆘 SOS</button>
    </div>
    <div class="areas" id="areasBar"></div>
  </header>

  <main>
    <section id="sec-now" class="section on"></section>
    <section id="sec-prepare" class="section"></section>
    <section id="sec-grid" class="section"></section>
    <section id="sec-community" class="section"></section>
    <section id="sec-you" class="section"></section>
  </main>

  <div class="fabwrap">
    <span class="qbadge" id="qBadge" role="status" aria-live="polite" style="display:none">0</span>
    <button class="fab" id="fab" aria-label="Report an issue">＋</button>
  </div>

  <nav id="nav" aria-label="Main navigation">
    <button data-tab="now" class="on"><span class="ni">◎</span>Now</button>
    <button data-tab="prepare"><span class="ni">⏳</span>Prepare</button>
    <button data-tab="grid"><span class="ni">🤝</span>Grid</button>
    <button data-tab="community"><span class="ni">🗣️</span>Community</button>
    <button data-tab="you"><span class="ni">👤</span>You</button>
  </nav>
</div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script src="/static/js/app.js?v=3.2.0"></script>
<script>setTimeout(() => { const s = document.getElementById("splash"); if (s) s.remove(); }, 500);</script>
</body>
</html>
